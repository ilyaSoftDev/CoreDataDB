#
# ai-review.yml
# CoreDataDB
#
# Claude reviews each pull request and posts its findings as inline comments.
#
# ADVISORY, not a gate. `continue-on-error` on the Review step keeps the job's
# conclusion green whatever the review concludes, and this job is deliberately
# absent from the required status checks on develop. The reasoning: a nondeterministic reviewer wired
# straight to the merge button blocks on style opinions and erodes trust in the
# checks that do mean something. Build, test and podspec are the hard gates.
#
# To promote it to blocking once the signal quality is known:
#
#   1. Add `--json-schema` to claude_args so findings come back severity-tagged
#      in the step's `structured_output`.
#   2. Add a step that exits non-zero only on critical correctness findings.
#   3. Drop `continue-on-error`, and add a `skip-ai-review` label to the job's
#      `if:` as an escape hatch.
#   4. Add `ai-review` to the required checks on develop.
#

name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  ai-review:
    name: ai-review
    # Drafts are skipped because the review is about to be invalidated anyway.
    # Fork pull requests are skipped because this repository is public and
    # GitHub withholds secrets from fork runs — the job would fail on a missing
    # credential rather than skip, and show a red X for an unactionable reason.
    # (LICENSE section 3 refuses outside contributions, so this is a formality.)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Distinguishes "not configured yet" from "the review failed", which are
      # very different things to see on a pull request.
      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the AI review."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review
        if: steps.creds.outputs.configured == 'true'
        # Step-level, not just job-level. `continue-on-error` on the job stops a
        # failure from failing the workflow RUN, but the job's own conclusion is
        # still `failure`, so the ai-review check reports red on the pull
        # request — which is the thing this tier is supposed to never do. Only
        # marking the step keeps the job's conclusion success.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Swap to `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` to
          # bill the API rather than a Claude subscription.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools is required even though the skill's own frontmatter
          # names the same tool: the action only starts the inline-comment MCP
          # server when claude_args asks for it. Without this the review runs
          # and posts nothing, landing only in the workflow log.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
